[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snap7-gateway"
version = "0.1.0"
description = "Snap7 Industrial Gateway - S7 PLC to DeviceWise bridge with virtual S7 CPU"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
dependencies = [
    "python-snap7>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
snap7-gateway = "snap7_gateway.service.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"snap7_gateway.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
